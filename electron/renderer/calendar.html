<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>栏历</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <img class="topbar-app-icon" src="../assets/icon.png" width="16" height="16" alt="">
        <span class="topbar-title">栏历</span>
      </div>
      <div class="topbar-right">
        <button
          class="topbar-icon check-update"
          id="check-update"
          type="button"
          aria-label="检查更新"
        >
          <svg class="update-icon" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <circle class="update-ring" cx="7" cy="7" r="5.75"/>
            <path class="update-arc" d="M7 1.25A5.75 5.75 0 0 1 12.75 7"/>
            <path class="update-arrow" d="M7 4v5.5M4.75 7.25 7 9.5l2.25-2.25"/>
          </svg>
          <span class="update-dot" aria-hidden="true"></span>
        </button>
        <button
          class="topbar-icon pin-button"
          id="pin-button"
          type="button"
          aria-label="钉住窗口"
          aria-pressed="false"
        >
          <svg class="pin-icon pin-icon-pin" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M9.828.722a.5.5 0 0 1 .354.146l4.95 4.95a.5.5 0 0 1 0 .707c-.48.48-1.072.588-1.503.588-.177 0-.335-.018-.46-.039l-3.134 3.134a5.927 5.927 0 0 1 .16 1.013c.046.702-.032 1.687-.72 2.375a.5.5 0 0 1-.707 0l-2.829-2.828-3.182 3.182c-.195.195-1.219.902-1.414.707-.195-.195.512-1.22.707-1.414l3.182-3.182-2.828-2.829a.5.5 0 0 1 0-.707c.688-.688 1.673-.767 2.375-.72a5.922 5.922 0 0 1 1.013.16l3.134-3.133a2.772 2.772 0 0 1-.04-.461c0-.43.108-1.022.589-1.503a.5.5 0 0 1 .353-.146z"/>
          </svg>
          <svg class="pin-icon pin-icon-close" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
            <path d="M4 4l8 8m0-8-8 8"/>
          </svg>
        </button>
        <button
          class="nav-pill settings-button"
          id="settings-button"
          type="button"
          aria-label="设置"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="settings-gear" aria-hidden="true">⚙︎</span>
          <span>设置</span>
        </button>
      </div>
    </header>

    <div class="icon-tooltip" id="icon-tooltip" role="tooltip" hidden>钉住窗口，移开鼠标也不隐藏</div>

    <div class="app-body">
      <main class="calendar-pane">
        <header class="toolbar">
          <div class="title-group">
            <label class="month-title">
              <span class="month-title-text" id="month-title">—</span>
              <select class="year-select" id="year-select" aria-label="选择公历年份"></select>
            </label>
            <span class="lunar-subtitle" id="lunar-subtitle">—</span>
          </div>
          <nav class="month-nav" aria-label="月份导航">
            <button class="nav-circle" id="prev-month" type="button" aria-label="上一月">‹</button>
            <button class="nav-pill" id="today-button" type="button">今天</button>
            <button class="nav-circle" id="next-month" type="button" aria-label="下一月">›</button>
          </nav>
        </header>

        <div class="weekdays" aria-hidden="true">
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span class="weekday-weekend">六</span>
          <span class="weekday-weekend">日</span>
        </div>

        <div class="grid" id="grid" role="grid" aria-label="月历"></div>
      </main>

    <aside class="now-pane" aria-label="黄历、世界时钟与天气">
      <section class="card almanac-card" id="almanac-card" aria-label="黄历">
        <div class="card-head">
          <span class="card-title almanac-style-name" id="almanac-style-name">农历黄历</span>
          <span class="card-swap almanac-head-swap">
            <button class="card-link" id="almanac-customize" type="button">去定制 ›</button>
          </span>
        </div>
        <div class="almanac-focus-row">
          <span class="almanac-tag almanac-tag-yi">宜</span>
          <span class="almanac-focus-text" id="almanac-focus-yi">—</span>
        </div>
        <div class="almanac-focus-row">
          <span class="almanac-tag almanac-tag-ji">忌</span>
          <span class="almanac-focus-text" id="almanac-focus-ji">—</span>
        </div>
        <div class="almanac-quote-row">
          <span class="almanac-tag almanac-tag-qian">签</span>
          <span class="almanac-quote" id="almanac-quote"></span>
        </div>
      </section>

      <section class="card world-clock-card" aria-label="世界时钟">
        <div class="card-head">
          <span class="card-title">世界时钟</span>
          <button class="card-link" id="clock-edit" type="button">编辑 ›</button>
        </div>
        <div class="clock-list" id="clock-list"></div>
        <div class="clock-empty" id="clock-empty" hidden>尚未添加城市</div>
      </section>

      <button class="card weather-card" id="weather-card" type="button" aria-label="更换天气城市">
        <span class="weather-emoji" id="weather-emoji">🌡️</span>
        <span class="weather-temp" id="weather-temp">—</span>
        <span class="weather-range" id="weather-range" hidden></span>
        <span class="card-swap weather-swap">
          <span class="weather-city" id="weather-city">天气加载中…</span>
          <span class="card-link weather-change">更换 ›</span>
        </span>
      </button>

      <div class="pane-footer">
        <span class="app-version" id="app-version" aria-label="当前版本"></span>
      </div>
    </aside>
    </div>

    <div class="picker-overlay" id="clock-picker" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="编辑世界时钟">
        <div class="picker-head">
          <span class="picker-title">编辑世界时钟</span>
          <button class="picker-close" id="clock-picker-close" type="button">完成</button>
        </div>
        <input
          class="clock-search"
          id="clock-search"
          type="search"
          placeholder="搜索城市或时区"
          autocomplete="off"
          spellcheck="false"
        >
        <div class="picker-list picker-results" id="clock-search-results" role="listbox" aria-label="搜索时区"></div>
        <div class="picker-section-label">已添加城市</div>
        <div class="picker-added-list" id="clock-added-list"></div>
      </section>
    </div>

    <div class="picker-overlay" id="weather-picker" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="选择天气城市">
        <div class="picker-head">
          <span class="picker-title">天气城市</span>
          <button class="picker-close" id="weather-picker-close" type="button">完成</button>
        </div>
        <input
          class="clock-search"
          id="weather-search"
          type="search"
          placeholder="搜索城市"
          autocomplete="off"
          spellcheck="false"
        >
        <div class="picker-list" id="weather-list" role="listbox" aria-label="选择天气城市"></div>
      </section>
    </div>

    <div class="picker-overlay" id="almanac-picker" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="选择黄历风格">
        <div class="picker-head">
          <span class="picker-title">黄历风格</span>
          <button class="picker-close" id="almanac-picker-close" type="button">完成</button>
        </div>
        <div class="picker-list" id="almanac-style-list" role="listbox" aria-label="选择黄历风格"></div>
      </section>
    </div>

    <div class="picker-overlay" id="almanac-detail" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="今日黄历">
        <div class="picker-head">
          <span class="picker-title" id="almanac-detail-title">今日黄历</span>
          <button class="picker-close" id="almanac-detail-close" type="button">完成</button>
        </div>
        <div class="almanac-detail-body" id="almanac-detail-body"></div>
      </section>
    </div>
  </div>

  <div class="toast" id="update-toast" role="status" hidden>
    <span class="toast-status" aria-hidden="true">
      <svg class="toast-glyph toast-glyph-busy" viewBox="0 0 24 24" focusable="false" hidden>
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      <svg class="toast-glyph toast-glyph-done" viewBox="0 0 16 16" focusable="false" hidden>
        <path d="M6.2 11.4 2.8 8l1.1-1.1 2.3 2.3 5-5L12.3 5.3z"/>
      </svg>
    </span>
    <span class="toast-message" id="update-toast-message"></span>
    <button class="toast-action" id="update-toast-action" type="button" hidden>重启更新</button>
    <button class="toast-close" id="update-toast-close" type="button" aria-label="关闭" hidden>×</button>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
