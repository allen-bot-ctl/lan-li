<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>栏历</title>
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <img class="topbar-app-icon" src="../assets/icon.png" width="16" height="16" alt="">
        <span class="topbar-title">栏历</span>
      </div>
      <div class="topbar-right">
        <button
          class="topbar-icon inbox-button"
          id="inbox-button"
          type="button"
          aria-label="收纳"
        >
          <svg class="inbox-icon" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <path d="M2 8v3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8"/>
            <path d="M2 8l1.6-5h6.8L12 8H9.2l-.7 1.4H5.5L4.8 8z"/>
          </svg>
        </button>
        <button
          class="topbar-icon check-update"
          id="check-update"
          type="button"
          aria-label="检查更新"
        >
          <svg class="update-icon" viewBox="0 0 14 14" aria-hidden="true" focusable="false">
            <circle class="update-ring" cx="7" cy="7" r="5.75"/>
            <path class="update-arc" d="M7 1.25A5.75 5.75 0 0 1 12.75 7"/>
            <path class="update-arrow" d="M7 4v5.5M4.75 7.25 7 9.5l2.25-2.25"/>
          </svg>
          <span class="update-dot" aria-hidden="true"></span>
        </button>
        <button
          class="topbar-icon pin-button"
          id="pin-button"
          type="button"
          aria-label="钉住窗口"
          aria-pressed="false"
        >
          <svg class="pin-icon pin-icon-pin" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M9.828.722a.5.5 0 0 1 .354.146l4.95 4.95a.5.5 0 0 1 0 .707c-.48.48-1.072.588-1.503.588-.177 0-.335-.018-.46-.039l-3.134 3.134a5.927 5.927 0 0 1 .16 1.013c.046.702-.032 1.687-.72 2.375a.5.5 0 0 1-.707 0l-2.829-2.828-3.182 3.182c-.195.195-1.219.902-1.414.707-.195-.195.512-1.22.707-1.414l3.182-3.182-2.828-2.829a.5.5 0 0 1 0-.707c.688-.688 1.673-.767 2.375-.72a5.922 5.922 0 0 1 1.013.16l3.134-3.133a2.772 2.772 0 0 1-.04-.461c0-.43.108-1.022.589-1.503a.5.5 0 0 1 .353-.146z"/>
          </svg>
          <svg class="pin-icon pin-icon-close" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
            <path d="M5.5 5.5l5 5m0-5-5 5"/>
          </svg>
        </button>
        <button
          class="nav-pill settings-button"
          id="settings-button"
          type="button"
          aria-label="设置"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="settings-gear" aria-hidden="true">⚙︎</span>
          <span>设置</span>
        </button>
      </div>
    </header>

    <div class="icon-tooltip" id="icon-tooltip" role="tooltip" hidden>钉住窗口，移开鼠标也不隐藏</div>

    <div class="app-body">
      <main class="calendar-pane">
        <header class="toolbar">
          <div class="title-group">
            <label class="month-title" data-tooltip="选择年份">
              <span class="month-title-text" id="month-title">—</span>
              <span class="month-title-caret" aria-hidden="true">⌄</span>
              <select class="year-select" id="year-select" aria-label="选择公历年份"></select>
            </label>
            <span class="lunar-subtitle" id="lunar-subtitle">—</span>
          </div>
          <nav class="month-nav" aria-label="月份导航">
            <button class="nav-circle" id="prev-month" type="button" aria-label="上一月" data-tooltip="上个月">‹</button>
            <button class="nav-pill" id="today-button" type="button" data-tooltip="回到今天">今天</button>
            <button class="nav-circle" id="next-month" type="button" aria-label="下一月" data-tooltip="下个月">›</button>
          </nav>
        </header>

        <div class="weekdays" aria-hidden="true">
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span class="weekday-weekend">六</span>
          <span class="weekday-weekend">日</span>
        </div>

        <div class="grid" id="grid" role="grid" aria-label="月历"></div>
      </main>

    <aside class="now-pane" aria-label="黄历、世界时钟与天气">
      <section class="card almanac-card" id="almanac-card" aria-label="黄历">
        <div class="card-head">
          <span class="card-title almanac-style-name" id="almanac-style-name">农历黄历</span>
          <span class="card-swap almanac-head-swap">
            <button class="card-link" id="almanac-customize" type="button">去定制 ›</button>
          </span>
        </div>
        <div class="almanac-focus-row">
          <span class="almanac-tag almanac-tag-yi">宜</span>
          <span class="almanac-focus-text" id="almanac-focus-yi">—</span>
        </div>
        <div class="almanac-focus-row">
          <span class="almanac-tag almanac-tag-ji">忌</span>
          <span class="almanac-focus-text" id="almanac-focus-ji">—</span>
        </div>
        <div class="almanac-quote-row">
          <span class="almanac-quote" id="almanac-quote"></span>
          <button class="almanac-redraw" id="almanac-redraw" type="button" aria-label="重新抽签" data-tooltip="重新抽签"><svg class="qiantong" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="24" height="24" aria-hidden="true" focusable="false"> <defs> <linearGradient id="qt-cup" x1="0" x2="1" y1="0" y2="0"> <stop offset="0" stop-color="#C8372D"/><stop offset=".45" stop-color="#EE5A45"/><stop offset="1" stop-color="#B92F27"/> </linearGradient> <linearGradient id="qt-stick" x1="0" x2="1"> <stop offset="0" stop-color="#E9B979"/><stop offset="1" stop-color="#D49A55"/> </linearGradient> <linearGradient id="qt-gold" x1="0" x2="1"> <stop offset="0" stop-color="#E0A62A"/><stop offset=".5" stop-color="#F7CF5C"/><stop offset="1" stop-color="#D89A22"/> </linearGradient> </defs> <g id="qt-sticks" stroke-linecap="round" stroke-width="5" stroke="#DFAA66"> <line x1="19" y1="30" x2="14" y2="12"/> <line x1="25" y1="30" x2="23" y2="9"/> <line x1="39" y1="30" x2="41" y2="9"/> <line x1="45" y1="30" x2="50" y2="12"/> </g> <g id="pop-stick"> <line x1="32" y1="30" x2="32" y2="4" stroke="#DFAA66" stroke-width="5" stroke-linecap="round"/> <rect x="29.5" y="5" width="5" height="6" rx="2" fill="#C8372D"/> </g> <path d="M13 28 h38 l-2.5 28 a4 4 0 0 1 -4 3.5 h-25 a4 4 0 0 1 -4 -3.5 z" fill="url(#qt-cup)"/> <rect x="11" y="25" width="42" height="6" rx="3" fill="url(#qt-gold)"/> <rect x="14.5" y="53" width="35" height="5" rx="2.5" fill="url(#qt-gold)"/> <path d="M18 36 q14 3 28 0 M18.5 45 q13.5 3 27 0" stroke="#A82820" stroke-width="1.4" fill="none" opacity=".55"/> <circle cx="32" cy="41" r="3.2" fill="none" stroke="#F7CF5C" stroke-width="1.6"/> </svg></button>
        </div>
      </section>

      <section class="card world-clock-card" aria-label="世界时钟">
        <div class="card-head">
          <span class="card-title">世界时钟</span>
          <button class="card-link" id="clock-edit" type="button">编辑 ›</button>
        </div>
        <div class="clock-list" id="clock-list"></div>
        <div class="clock-empty" id="clock-empty" hidden>尚未添加城市</div>
      </section>

      <button class="card weather-card" id="weather-card" type="button" aria-label="更换天气城市">
        <span class="weather-emoji" id="weather-emoji">🌡️</span>
        <span class="weather-temp" id="weather-temp">—</span>
        <span class="weather-range" id="weather-range" hidden></span>
        <span class="card-swap weather-swap">
          <span class="weather-city" id="weather-city">天气加载中…</span>
          <span class="weather-retry" id="weather-retry" role="button" tabindex="0" hidden>重试</span>
          <span class="card-link weather-change">更换 ›</span>
        </span>
      </button>

      <div class="pane-footer">
        <span class="app-version" id="app-version" aria-label="当前版本"></span>
      </div>
    </aside>
    </div>

    <div class="inbox-view" id="inbox-view" hidden>
      <div class="inbox-head">
        <button class="settings-back inbox-back" id="inbox-back" type="button">‹ 返回</button>
        <span class="inbox-title" id="inbox-title">收纳</span>
        <span class="inbox-count" id="inbox-count"></span>
      </div>
      <div class="inbox-toolbar" id="inbox-toolbar">
        <input class="inbox-search" id="inbox-search" type="search" placeholder="搜索收纳（⌘F）" autocomplete="off" spellcheck="false">
        <div class="inbox-types" id="inbox-types" role="radiogroup" aria-label="类型">
          <button type="button" class="inbox-pill inbox-type is-active" data-type="all">全部</button>
          <button type="button" class="inbox-pill inbox-type" data-type="file">文件</button>
          <button type="button" class="inbox-pill inbox-type" data-type="image">图片</button>
          <button type="button" class="inbox-pill inbox-type" data-type="text">文字</button>
          <button type="button" class="inbox-pill inbox-type" data-type="link">链接</button>
        </div>
        <button type="button" class="inbox-cal-toggle" id="inbox-cal-toggle" title="按日期筛选" aria-label="按日期筛选"><svg class="inbox-cal-icon" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><rect x="2" y="3" width="10" height="9" rx="1.5"/><path d="M2 6h10M5 1.8v2.4M9 1.8v2.4"/></svg></button>
      </div>
      <div class="inbox-tagrow" id="inbox-tagrow">
        <span class="inbox-day-chip" id="inbox-day-chip" hidden><span id="inbox-day-chip-text"></span><button type="button" class="inbox-day-chip-x" id="inbox-day-chip-x" aria-label="取消日期筛选">×</button></span>
        <span class="inbox-tags" id="inbox-tags"></span>
        <span class="inbox-more-wrap"><button type="button" class="inbox-pill inbox-more" id="inbox-more" hidden></button><span class="inbox-more-menu" id="inbox-more-menu" hidden></span></span>
      </div>
      <div class="inbox-minical" id="inbox-minical" hidden>
        <div class="inbox-minical-head"><button type="button" id="inbox-minical-prev">‹</button><span id="inbox-minical-title"></span><button type="button" id="inbox-minical-next">›</button></div>
        <div class="inbox-minical-grid" id="inbox-minical-grid"></div>
      </div>
      <div class="inbox-list" id="inbox-list" role="list"></div>
      <div class="inbox-empty" id="inbox-empty" hidden>把文件、图片、文字或链接拖到菜单栏时钟上，就会收在这里</div>
      <div class="inbox-noresult" id="inbox-noresult" hidden><span>没有符合条件的收纳</span><button type="button" class="inbox-clear" id="inbox-clear">清除筛选</button></div>
      <div class="inbox-undo" id="inbox-undo" hidden><span>已删除 · </span><button type="button" id="inbox-undo-btn">撤销</button></div>
      <div class="inbox-tagpop" id="inbox-tagpop" hidden><input id="inbox-tag-input" type="text" maxlength="8" placeholder="加标签，回车" autocomplete="off"><span class="inbox-tag-suggest" id="inbox-tag-suggest"></span><span class="inbox-tagpop-err" id="inbox-tagpop-err"></span></div>
      <div class="inbox-detail" id="inbox-detail" hidden>
        <iframe class="inbox-detail-frame" id="inbox-detail-frame" sandbox="" title="收纳内容"></iframe>
      </div>
    </div>

    <div class="settings-view" id="settings-view" hidden>
      <nav class="settings-nav" aria-label="设置分类">
        <button class="settings-back" id="settings-back" type="button">‹ 返回</button>
        <div class="settings-nav-divider" role="separator"></div>
        <button class="settings-tab" type="button" data-tab="ui">界面设置</button>
        <button class="settings-tab" type="button" data-tab="almanac">黄历</button>
        <button class="settings-tab" type="button" data-tab="weather">天气</button>
        <button class="settings-tab" type="button" data-tab="clocks">世界时钟</button>
        <button class="settings-tab" type="button" data-tab="update">升级</button>
      </nav>
      <section class="settings-content" id="settings-content">
        <div class="settings-page-title" id="settings-page-title">界面设置</div>
        <div class="settings-page" id="settings-page-ui">
          <label class="settings-row"><span class="settings-label">开机自启动</span><input class="settings-switch" id="setting-open-at-login" type="checkbox" role="switch"><span class="switch-track" aria-hidden="true"></span></label>
          <label class="settings-row"><span class="settings-label">菜单栏显示日期</span><input class="settings-switch" id="setting-show-date" type="checkbox" role="switch"><span class="switch-track" aria-hidden="true"></span></label>
        </div>
        <div class="settings-page" id="settings-page-update" hidden>
          <div class="settings-row"><span class="settings-label">当前版本 <span id="settings-version"></span></span></div>
          <button class="nav-pill settings-check-update" id="settings-check-update" type="button">检查更新</button>
          <div class="settings-update-result" id="settings-update-result" hidden></div>
        </div>
      </section>
    </div>

    <div class="picker-overlay" id="clock-picker" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="编辑世界时钟">
        <div class="picker-head">
          <span class="picker-title">编辑世界时钟</span>
          <button class="picker-close" id="clock-picker-close" type="button">完成</button>
        </div>
        <input
          class="clock-search"
          id="clock-search"
          type="search"
          placeholder="搜索城市或时区"
          autocomplete="off"
          spellcheck="false"
        >
        <div class="picker-list picker-results" id="clock-search-results" role="listbox" aria-label="搜索时区"></div>
        <div class="picker-section-label">已添加城市</div>
        <div class="picker-added-list" id="clock-added-list"></div>
      </section>
    </div>

    <div class="picker-overlay" id="weather-picker" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="选择天气城市">
        <div class="picker-head">
          <span class="picker-title">天气城市</span>
          <button class="picker-close" id="weather-picker-close" type="button">完成</button>
        </div>
        <input
          class="clock-search"
          id="weather-search"
          type="search"
          placeholder="搜索城市"
          autocomplete="off"
          spellcheck="false"
        >
        <div class="picker-list" id="weather-list" role="listbox" aria-label="选择天气城市"></div>
      </section>
    </div>

    <div class="picker-overlay" id="almanac-picker" hidden>
      <section class="picker-sheet" role="dialog" aria-modal="true" aria-label="选择黄历风格">
        <div class="picker-head">
          <span class="picker-title">黄历风格</span>
          <button class="picker-close" id="almanac-picker-close" type="button">完成</button>
        </div>
        <div class="picker-list" id="almanac-style-list" role="listbox" aria-label="选择黄历风格"></div>
      </section>
    </div>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" data-type="info" hidden>
    <svg class="toast-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path id="toast-icon-path" d=""/></svg>
    <div class="toast-text">
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-detail" id="toast-detail" hidden></div>
    </div>
    <button class="toast-action" id="toast-action" type="button" hidden></button>
    <button class="toast-close" id="toast-close" type="button" aria-label="关闭">×</button>
    <div class="toast-progress" aria-hidden="true"></div>
  </div>

  <script src="toast.js"></script>
  <script src="inbox-query.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
