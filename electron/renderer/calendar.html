<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>栏历</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <div class="app" id="app">
    <main class="calendar-pane">
      <header class="toolbar">
        <select class="year-select" id="year-select" aria-label="选择公历年份"></select>
        <div class="focus-nav">
          <button class="nav-button" id="prev-month" type="button" aria-label="上一月">‹</button>
          <span class="focus-label" id="focus-label">1-1</span>
          <button class="nav-button" id="next-month" type="button" aria-label="下一月">›</button>
        </div>
        <button class="today-button" id="today-button" type="button">返回今天</button>
      </header>

      <div class="weekdays" aria-hidden="true">
        <span class="weekday">周一</span>
        <span class="weekday">周二</span>
        <span class="weekday">周三</span>
        <span class="weekday">周四</span>
        <span class="weekday">周五</span>
        <span class="weekday weekday-weekend">周六</span>
        <span class="weekday weekday-weekend">周日</span>
      </div>

      <div class="grid" id="grid" role="grid" aria-label="月历"></div>

      <div class="update-banner" id="update-banner" hidden>
        <span class="update-message" id="update-message">新版本已就绪</span>
        <button class="update-action" id="update-action" type="button">重启更新</button>
      </div>

      <footer class="footer">
        <label class="login-label" for="login-toggle">
          <input class="login-checkbox" id="login-toggle" type="checkbox">
          <span>登录时打开</span>
        </label>
        <div class="footer-actions">
          <button
            class="check-update-button"
            id="check-update-button"
            type="button"
            aria-label="检查更新"
          >
            <svg
              class="check-update-icon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M4.4 8.2a2.3 2.3 0 0 1 .5-4.5 3 3 0 0 1 5.7.4 2.1 2.1 0 0 1 .1 4.1" />
              <path d="M8 8.6v4.2" />
              <path d="M6.4 11.2 8 12.8l1.6-1.6" />
            </svg>
            <span class="check-update-label" id="check-update-label">检查更新</span>
          </button>
          <button class="quit-button" id="quit-button" type="button" aria-label="退出栏历">
            <svg
              class="quit-icon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 2v5" />
              <path d="M11.2 3.9a4.6 4.6 0 1 1-6.4 0" />
            </svg>
            <span>退出栏历</span>
          </button>
        </div>
      </footer>
    </main>

    <aside class="now-pane" aria-label="黄历与世界时钟">
      <section class="almanac-card" aria-label="黄历">
        <div class="pane-label">黄历</div>
        <div class="almanac-year" id="almanac-year">—</div>
        <div class="almanac-row">
          <span class="almanac-tag almanac-tag-yi">宜</span>
          <span class="almanac-items" id="almanac-yi">—</span>
        </div>
        <div class="almanac-row">
          <span class="almanac-tag almanac-tag-ji">忌</span>
          <span class="almanac-items" id="almanac-ji">—</span>
        </div>
      </section>

      <section class="world-clock" aria-label="世界时钟">
        <div class="pane-label world-head">
          <span>世界时钟</span>
          <span class="world-tools">
            <button class="clock-tool" id="clock-add" type="button" aria-label="添加时区">+</button>
            <button class="clock-tool" id="clock-remove" type="button" aria-label="移除当前时区">×</button>
          </span>
        </div>

        <div class="clock-card" id="clock-card">
          <div class="clock-row" id="clock-row">
            <button class="clock-arrow" id="clock-prev" type="button" aria-label="上一个时区">‹</button>
            <div class="clock-body">
              <div class="clock-city-row">
                <span class="clock-city" id="clock-city">北京</span>
              </div>
              <div class="clock-time" id="clock-time">00:00:00</div>
              <div class="clock-date" id="clock-date">1月1日 星期一</div>
              <button class="clock-set-current" id="clock-set-current" type="button">设为当前</button>
            </div>
            <button class="clock-arrow" id="clock-next" type="button" aria-label="下一个时区">›</button>
          </div>
          <div class="clock-dots" id="clock-dots" aria-hidden="true"></div>
          <div class="clock-empty" id="clock-empty" hidden>点击 + 添加时区</div>
        </div>
      </section>

      <section class="weather-card" aria-label="天气">
        <div class="pane-label">天气</div>
        <div class="weather-line" id="weather-text">天气加载中…</div>
      </section>

      <div class="pane-footer">
        <span class="app-version" id="app-version" aria-label="当前版本"></span>
      </div>

      <div class="clock-picker" id="clock-picker" hidden>
        <div class="picker-head">
          <input
            class="clock-search"
            id="clock-search"
            type="search"
            placeholder="搜索城市或时区"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="picker-close" id="clock-picker-close" type="button">完成</button>
        </div>
        <div class="picker-list" id="clock-list" role="listbox" aria-label="选择时区"></div>
      </div>
    </aside>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
