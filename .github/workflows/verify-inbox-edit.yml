name: Verify inbox detail candidate

on:
  push:
    branches: [integration/inbox-edit-v0.1.70]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Focused inbox regression
        run: npm run e2e -- inbox-edit inbox-detail-layout inbox-0142 row-actions-0159
