name: Verify LanLi 0.1.84
on:
  push:
    branches: [integration/verify-v0.1.84-r2]
permissions:
  contents: read
jobs:
  reader:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb37d1e6fbd3449a46313fca0018a6ca98850b57
      - name: Check exact tree and architecture
        run: |
          test "$(git rev-parse HEAD^{tree})" = "f612e8e5814e9b08bb5716688c260cb4464fe8b8"
          test "$(uname -m)" = x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run e2e -- e2e/reader-deepseek-search.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-deepseek-evidence
          if-no-files-found: warn
          path: |
            e2e/screenshots/
            test-results/
