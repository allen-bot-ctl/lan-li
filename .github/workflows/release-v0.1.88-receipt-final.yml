name: 栏历 v0.1.88 验证及发布

on:
  push:
    branches: [release/v0.1.88-receipt-final]
    paths: [.github/workflows/release-v0.1.88-receipt-final.yml]

permissions:
  contents: read

concurrency:
  group: release-v0.1.88-receipt-final
  cancel-in-progress: false

env:
  VERSION_TAG: v0.1.88
  SOURCE_SHA: 9a6137ebf53091a86301cf65af2c0bca7eb2f210
  SOURCE_TREE: 7b340a3d1cffb22beb07338c0d1edd01b88eac98
  BASELINE_SHA: 0e91844c244e6f97f278ab3dda5c945d5ee729c3

jobs:
  macos:
    name: Build macOS Intel (x64) packages
    if: github.repository == 'allen-bot-ctl/lan-li' && github.ref_name == 'release/v0.1.88-receipt-final' && github.actor_id == '352863755'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify approved candidate and runner
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^)" = "$BASELINE_SHA"
          test "$(node -p 'require("./package.json").version')" = "${VERSION_TAG#v}"
          test "$(uname -m)" = x86_64

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          npm test 2>&1 | tee /tmp/tests.log
          status=${PIPESTATUS[0]}
          pass=$(awk '/^(#|ℹ) pass /{print $3}' /tmp/tests.log | tail -n 1)
          fail=$(awk '/^(#|ℹ) fail /{print $3}' /tmp/tests.log | tail -n 1)
          total=$(( ${pass:-0} + ${fail:-0} ))
          echo "RELEASE: tests=${pass:-?}/${total}"
          exit "$status"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium || true

      - name: Verify compact preview and tags on Intel
        run: npm run e2e -- e2e/inbox-capture-tags.spec.js e2e/{clipboard-0149,compose-0162,inbox-edit,inbox-editor-paste,panel-paste-0157,rich-meta-0158}.spec.js

      - name: Upload focused native screenshots before full suite
        uses: actions/upload-artifact@v4
        with:
          name: capture-preview-focused
          if-no-files-found: error
          path: |
            e2e/screenshots/capture-rich-preview-*.png
            e2e/screenshots/capture-tags-*.png

      - name: Verify adjacent inbox detail and editor dialogs
        run: npm run e2e -- e2e/inbox-detail-layout.spec.js

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          if-no-files-found: warn
          path: e2e/screenshots/

      - name: Import stable signing certificate
        shell: bash
        env:
          LANLI_SIGN_P12: ${{ secrets.LANLI_SIGN_P12 }}
          LANLI_SIGN_PASSWORD: ${{ secrets.LANLI_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$LANLI_SIGN_P12" ] || { echo "::error::LANLI_SIGN_P12 secret missing"; exit 1; }
          kc="$RUNNER_TEMP/lanli-sign.keychain-db"
          kcpass=$(openssl rand -hex 16)
          echo "$LANLI_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/lanli-sign.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/lanli-sign.p12" -k "$kc" -P "$LANLI_SIGN_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/lanli-sign.p12" -nokeys -passin env:LANLI_SIGN_PASSWORD -legacy -out "$RUNNER_TEMP/lanli-sign.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/lanli-sign.p12" -nokeys -passin env:LANLI_SIGN_PASSWORD -out "$RUNNER_TEMP/lanli-sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/lanli-sign.pem"
          rm -f "$RUNNER_TEMP/lanli-sign.p12"
          security find-identity -p codesigning "$kc"
          echo "LANLI_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build macOS Intel dmg and zip
        run: npx electron-builder --mac dmg zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LANLI_SIGN_IDENTITY: "LanLi Self-Signed"

      - name: Verify x64 binaries with lipo
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::no .app found under dist"; exit 1; }
          echo "app: $app"
          main_bin=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          [ -n "$main_bin" ] || { echo "::error::no main binary under Contents/MacOS"; exit 1; }
          fw_bin="$app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          if [ ! -e "$fw_bin" ]; then
            fw_bin="$app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          fi
          [ -e "$fw_bin" ] || { echo "::error::no Electron Framework binary"; exit 1; }
          echo "main binary: $main_bin"
          echo "framework binary: $fw_bin"
          file "$main_bin"
          file "$fw_bin"
          for bin in "$main_bin" "$fw_bin"; do
            archs=$(lipo -archs "$bin")
            echo "RELEASE: lipo $(basename "$bin")=$archs"
            if [ "$archs" != "x86_64" ]; then
              echo "::error::$(basename "$bin") archs=$archs, expected exactly x86_64"
              exit 1
            fi
          done
          echo "RELEASE: lipo=x86_64"

      - name: Verify stable signature
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::no .app found under dist"; exit 1; }
          codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/codesign.log
          grep -q "Authority=LanLi Self-Signed" /tmp/codesign.log || { echo "::error::not signed by LanLi Self-Signed"; exit 1; }
          if grep -q "Signature=adhoc" /tmp/codesign.log; then echo "::error::still ad-hoc"; exit 1; fi
          codesign -d -r- "$app" 2>&1 | tee /tmp/dr1.txt
          grep -q "certificate leaf" /tmp/dr1.txt || { echo "::error::designated has no certificate leaf"; exit 1; }
          if grep -q "cdhash" /tmp/dr1.txt; then echo "::error::designated still uses cdhash"; exit 1; fi
          # 0.1.52 PM 定：designated 与仓库里的 build/expected-designated.txt 逐字一致（只有 bundle id 和证书公开指纹）
          actual=$(grep -o 'designated => .*' /tmp/dr1.txt | sed 's/^designated => //')
          expected=$(cat build/expected-designated.txt)
          [ "$actual" = "$expected" ] || { echo "::error::designated mismatch"; echo "expected: $expected"; echo "actual:   $actual"; exit 1; }
          codesign --verify --deep --strict "$app"
          echo "RELEASE: designated=$(grep designated /tmp/dr1.txt)"
          # S-C2：同一份产物再签一遍，designated 必须一字不差
          cp -R "$app" "$RUNNER_TEMP/again.app"
          codesign --force --deep --sign "LanLi Self-Signed" --timestamp=none --keychain "$LANLI_SIGN_KEYCHAIN" "$RUNNER_TEMP/again.app"
          codesign -d -r- "$RUNNER_TEMP/again.app" 2>&1 | grep designated > /tmp/dr2.txt
          grep designated /tmp/dr1.txt | diff - /tmp/dr2.txt || { echo "::error::designated differs between two signings"; exit 1; }
          echo "RELEASE: codesign=stable"

      - name: Smoke test x64 app under Rosetta
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::no .app found under dist"; exit 1; }
          main_bin=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          [ -n "$main_bin" ] || { echo "::error::no main binary under Contents/MacOS"; exit 1; }
          echo "smoke binary: $main_bin"

          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "Rosetta not available yet, trying to install"
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "::error::Rosetta unavailable, cannot run x64 smoke test"
            exit 1
          fi
          echo "RELEASE: rosetta=ok"

          log=/tmp/x64-smoke.log
          : > "$log"
          echo "file $main_bin: $(file "$main_bin")"
          arch -x86_64 "$main_bin" >"$log" 2>&1 &
          launcher=$!

          app_pids() {
            local found
            found=$(pgrep -f "$main_bin" || true)
            if [ -n "$found" ]; then
              printf '%s\n' "$found"
            else
              printf '%s\n' "$launcher"
            fi
          }

          fail() {
            echo "::error::$1"
            echo "--- app output ---"
            cat "$log" || true
            pkill -KILL -f "$main_bin" 2>/dev/null || true
            kill -KILL "$launcher" 2>/dev/null || true
            exit 1
          }

          check_alive_x64() {
            local phase="$1" pid alive=0 pids
            pids=$(app_pids | tr '\n' ' ')
            for pid in $pids; do
              if kill -0 "$pid" 2>/dev/null; then
                alive=1
              fi
            done
            [ "$alive" -eq 1 ] || fail "app is not running at ${phase}"
            # This runner's ps has no arch keyword; verify the executable
            # architecture with file instead of ps -o arch or vmmap.
            if ! file "$main_bin" | grep -q 'x86_64'; then
              fail "running executable is not x86_64 at ${phase}"
            fi
            echo "RELEASE: smoke=alive arch=x86_64 at=${phase}"
          }

          sleep 5
          check_alive_x64 5s
          sleep 15
          check_alive_x64 20s

          pids=$(app_pids | tr '\n' ' ')
          kill -TERM $pids 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! kill -0 "$launcher" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -KILL $pids 2>/dev/null || true
          pkill -KILL -f "$main_bin" 2>/dev/null || true
          wait "$launcher" 2>/dev/null || true
          echo "--- app output ---"
          cat "$log" || true
          echo "RELEASE: smoke=ok 20s"

      - name: Generate zip checksum for in-app update
        run: |
          cd dist
          for f in LanLi-*-mac-x64.zip; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            dist/LanLi-*-mac-x64.dmg
            dist/LanLi-*-mac-x64.zip
            dist/LanLi-*-mac-x64.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: [macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          sparse-checkout: release-notes

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Download e2e screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-screenshots
          path: screenshots

      - name: List release files
        run: |
          ls -lh dist
          ls -lh screenshots || true

      - name: Prepare release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.VERSION_TAG }}
        run: |
          VERSION="${TAG#v}"
          # 已有 Release 且说明非空（例如已从 Mac 构建手动发布）时不覆盖说明。
          EXISTING="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "Release $TAG 已有说明，保留不动"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOTES="release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            echo "使用 $NOTES"
            cp "$NOTES" "$RUNNER_TEMP/release-notes.md"
          else
            echo "未找到 $NOTES，使用通用模板"
            cat > "$RUNNER_TEMP/release-notes.tpl" <<'NOTES_EOF'
            ## 栏历 __TAG__

            本轮只提供 macOS Intel（x64）安装包。主下载是 `LanLi-*-mac-x64.dmg`；`LanLi-*-mac-x64.zip` 与 `LanLi-*-mac-x64.zip.sha256` 供 0.1.6 起的未签名包应用内自更新使用。

            ### 本版变化

            - 本版变化见源码提交记录。

            ### 安装

            - 下载 `LanLi-*-mac-x64.dmg`，打开后把「栏历」拖入「应用程序」。
            - 0.1.6 起可在应用内「检查更新」：应用会下载 zip、比对同名 `.sha256`，重启后替换旧版本；校验失败时回退为直接下载同版本 dmg。
            - 0.1.5 及更早版本没有应用内自更新，必须手动安装一次 0.1.6。
            - 当前只支持 Intel（x64）Mac，暂不提供 Apple Silicon（arm64）、Windows 或 Linux 安装包。

            ### 验证

            - `npm test` 与 Playwright `_electron` 端到端（C1–C10）已在构建前通过。
            - 包内主程序与 Electron Framework 经 `lipo -archs` 断言为 `x86_64`，并在 Rosetta 下真启动冒烟 20 秒。
            - e2e 截图见本 Release 附件。

            ### 未签名说明

            macOS 构建未签名，不是 Developer ID 签名，也未公证。

            Gatekeeper 可能阻止首次打开。请在 Finder 中右键「栏历」选择「打开」，或到「系统设置 → 隐私与安全性」选择「仍要打开」。

            ### 源码

            https://github.com/allen-bot-ctl/lan-li
          NOTES_EOF
            sed -e 's/^  //' -e "s/__TAG__/${TAG}/g" "$RUNNER_TEMP/release-notes.tpl" > "$RUNNER_TEMP/release-notes.md"
          fi
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Check previous release and fast-forward exact verified master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.87
          test "$(gh api "$api/git/matching-refs/tags/$VERSION_TAG" --jq length)" = 0
          head="$(gh api "$api/git/ref/heads/master" --jq .object.sha)"
          test "$head" = "$BASELINE_SHA" || test "$head" = "$SOURCE_SHA"
          if [ "$head" = "$BASELINE_SHA" ]; then
            gh api --method PATCH "$api/git/refs/heads/master" -f sha="$SOURCE_SHA" -F force=false --jq .object.sha
          fi
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$SOURCE_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: 栏历 ${{ env.VERSION_TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/LanLi-*-mac-x64.dmg
            dist/LanLi-*-mac-x64.zip
            dist/LanLi-*-mac-x64.zip.sha256
            screenshots/*.png
          fail_on_unmatched_files: false
          make_latest: true
          overwrite_files: false
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
