name: Verify LanLi tray refinement v0.1.80
on:
  push:
    branches: [integration/verify-v0.1.80]
    paths: [.github/workflows/dot-verify-tray-clock-v0.1.80.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755'
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      EXPECTED: e201aeaab7f2ec785f9619732b46a97424b65424
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED }}
          persist-credentials: false
      - name: Verify exact checked-out source and Intel runner
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(uname -m)" = x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Verify native Tray framing, preferences and grouped settings
        run: npm run e2e -- e2e/tray-compact-clock.spec.js e2e/settings-layout.spec.js
      - name: Retain short-lived synthetic UI verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-native-tray-frames
          path: |
            test-results/**/tray-compact-*.png
            test-results/**/settings-layout*/*.png
          retention-days: 3
          if-no-files-found: warn
