name: Dispatch authorized LanLi v0.1.75

on:
  push:
    branches: [integration/release-v0.1.75]

permissions: {}

concurrency:
  group: one-shot-lan-li-v0.1.75
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755' && github.triggering_actor == 'allen-bot-ctl' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: 99d2a657ac3c7aa7f8f3d7d83340521e8757719b
      BASELINE: ef1bd0b7d2fb2e7f37cf51c4cf6a14b63a558eef
    steps:
      - name: Verify exact fast-forward, release baseline and vacant tag
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/tags/v0.1.73" --jq .object.sha)" = "$BASELINE"
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.73
          test "$(gh api "$api/git/commits/$EXPECTED" --jq '[.parents[].sha] | join(" ")')" = "aca33927333616482604503284e448bc09834960"
          test "$(gh api "$api/git/ref/tags/v0.1.74" --jq .object.sha)" = "aca33927333616482604503284e448bc09834960"
          test "$(gh api "$api/actions/runs/45530655895" --jq '[.head_sha,.conclusion] | join(" ")')" = "aca33927333616482604503284e448bc09834960 failure"
          if gh api "$api/releases/tags/v0.1.74" >/dev/null 2>"$RUNNER_TEMP/lan-li-failed.err"; then exit 1; fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/lan-li-failed.err"
          test "$(gh api "$api/contents/package.json?ref=$EXPECTED" --jq .content | base64 -d | jq -r .version)" = 0.1.75
          test "$(gh api "$api/contents/release-notes/v0.1.75.md?ref=$EXPECTED" --jq .size)" -gt 0
          test "$(gh api "$api/git/matching-refs/tags/v0.1.75" --jq '[.[] | select(.ref == "refs/tags/v0.1.75")] | length')" = 0
          if gh api "$api/releases/tags/v0.1.75" >/dev/null 2>"$RUNNER_TEMP/lan-li-existing.err"; then
            echo "::error::Release already exists; refusing to replace it."
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/lan-li-existing.err"
          gh api --method POST "$api/git/refs" -f ref=refs/tags/v0.1.75 -f sha="$EXPECTED" --jq '[.ref,.object.sha] | @tsv'
          test "$(gh api "$api/git/ref/tags/v0.1.75" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          if ! gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag=v0.1.75 -f runner=macos-15-intel; then
            echo "::error::Tag exists; verify exact SHA and existing Release runs. Do not retag or rerun the one-shot."
            exit 1
          fi
