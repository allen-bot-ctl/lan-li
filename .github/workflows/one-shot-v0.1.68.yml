name: Dispatch authorized LanLi v0.1.68

on:
  push:
    branches: [integration/release-v0.1.68]

permissions: {}

concurrency:
  group: one-shot-lan-li-v0.1.68
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755' && github.triggering_actor == 'allen-bot-ctl' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: 2f77feb2a3c6ac07ae66eac10e4f8fd4e953fc5a
      BASELINE: 58d0fe4a8f3d2be7e2d6c34cbfca0b75811f50fd
      CI_SHA: 320a64220416e0b3799a816ae67e5265fafc7ff4
    steps:
      - name: Confirm exact version, master, existing release and the successful UI verification
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/tags/v0.1.66" --jq .object.sha)" = "$BASELINE"
          test "$(gh api "$api/git/ref/tags/v0.1.67" --jq .object.sha)" = 13a3102092aecc1b434e87b36d8929ada6550697
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.66
          test "$(gh api "$api/actions/runs/45376770343" --jq '[.head_sha,.conclusion,.head_branch]|join(" ")')" = "$CI_SHA success integration/inbox-escape-v0.1.68"
          test "$(gh api "$api/contents/package.json?ref=$EXPECTED" --jq .content | base64 -d | jq -r .version)" = 0.1.68
          test "$(gh api "$api/contents/release-notes/v0.1.68.md?ref=$EXPECTED" --jq .size)" -gt 0
          test "$(gh api "$api/git/matching-refs/tags/v0.1.68" --jq '[.[] | select(.ref == "refs/tags/v0.1.68")] | length')" = 0
          if gh api "$api/releases/tags/v0.1.68" >/dev/null 2>"$RUNNER_TEMP/lan-li-existing.err"; then
            echo "Release already exists; refusing to replace"
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/lan-li-existing.err"
          gh api --method POST "$api/git/refs" -f ref=refs/tags/v0.1.68 -f sha="$EXPECTED" --jq '[.ref,.object.sha] | @tsv'
          test "$(gh api "$api/git/ref/tags/v0.1.68" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          if ! gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag=v0.1.68 -f runner=macos-15-intel; then
            echo "::error::Tag exists; verify exact SHA and existing Release runs. Do not retag or rerun the one-shot."
            exit 1
          fi
