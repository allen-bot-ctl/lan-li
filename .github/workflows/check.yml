name: Check

on:
  # 0.1.47：只手动触发；出包流程本身会跑完整测试，功能稳定后再考虑恢复自动
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node tests + Playwright e2e
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          npm test 2>&1 | tee /tmp/tests.log
          status=${PIPESTATUS[0]}
          pass=$(awk '/^(#|ℹ) pass /{print $3}' /tmp/tests.log | tail -n 1)
          fail=$(awk '/^(#|ℹ) fail /{print $3}' /tmp/tests.log | tail -n 1)
          total=$(( ${pass:-0} + ${fail:-0} ))
          echo "CHECK: tests=${pass:-?}/${total}"
          exit "$status"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium || true

      - name: Run Playwright e2e
        run: npm run e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          if-no-files-found: warn
          path: e2e/screenshots/
