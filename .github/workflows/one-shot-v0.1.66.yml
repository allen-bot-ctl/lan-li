name: Dispatch authorized LanLi v0.1.66

on:
  push:
    branches: [integration/release-v0.1.66]

permissions: {}

concurrency:
  group: one-shot-lan-li-v0.1.66
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755' && github.triggering_actor == 'allen-bot-ctl' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: 58d0fe4a8f3d2be7e2d6c34cbfca0b75811f50fd
      BASELINE: cc7451f774bd351afdadc452e77cdd3b4d04381d
      CI_SHA: ce2362ed7e39603d3b20117cdacf1263e94295ea
    steps:
      - name: Confirm exact version, master, existing release and the successful UI verification
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/tags/v0.1.64" --jq .object.sha)" = "$BASELINE"
          test "$(gh api "$api/git/ref/tags/v0.1.65" --jq .object.sha)" = 8ef5859c11ac64412ec5c6d79552cbd8c1cdf685
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.64
          test "$(gh api "$api/actions/runs/45358876896" --jq '[.head_sha,.conclusion,.head_branch]|join(" ")')" = "$CI_SHA success integration/settings-layout-v0.1.66"
          test "$(gh api "$api/contents/package.json?ref=$EXPECTED" --jq .content | base64 -d | jq -r .version)" = 0.1.66
          test "$(gh api "$api/contents/release-notes/v0.1.66.md?ref=$EXPECTED" --jq .size)" -gt 0
          test "$(gh api "$api/git/matching-refs/tags/v0.1.66" --jq '[.[] | select(.ref == "refs/tags/v0.1.66")] | length')" = 0
          if gh api "$api/releases/tags/v0.1.66" >/dev/null 2>"$RUNNER_TEMP/lan-li-existing.err"; then
            echo "Release already exists; refusing to replace"
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/lan-li-existing.err"
          gh api --method POST "$api/git/refs" -f ref=refs/tags/v0.1.66 -f sha="$EXPECTED" --jq '[.ref,.object.sha] | @tsv'
          test "$(gh api "$api/git/ref/tags/v0.1.66" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          if ! gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag=v0.1.66 -f runner=macos-15-intel; then
            echo "::error::Tag exists; verify exact SHA and existing Release runs. Do not retag or rerun the one-shot."
            exit 1
          fi
