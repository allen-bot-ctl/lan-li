name: Dispatch authorized LanLi v0.1.79
on:
  push:
    branches: [integration/release-v0.1.79]
permissions: {}
concurrency:
  group: one-shot-lan-li-v0.1.79
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755' && github.triggering_actor == 'allen-bot-ctl' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: 09ab2c9630ab13f2928ed85da2d0fd6b1f951806
      BASELINE: 6d3b5cca316a05bb613e6e73fb0e0ef352a5502a
    steps:
      - name: Verify exact revision, Intel validation, and release baseline
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/tags/v0.1.78" --jq .object.sha)" = "$BASELINE"
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.78
          test "$(gh api "$api/actions/runs/45550622354" --jq '[.head_sha,.conclusion] | join(" ")')" = "fed4d212d87af2825e04c7537379d20acd0504fe success"
          test "$(gh api "$api/git/commits/$EXPECTED" --jq '[.parents[].sha] | join(" ")')" = "$BASELINE"
          test "$(gh api "$api/contents/package.json?ref=$EXPECTED" --jq .content | base64 -d | jq -r .version)" = 0.1.79
          test "$(gh api "$api/contents/release-notes/v0.1.79.md?ref=$EXPECTED" --jq .size)" -gt 0
          test "$(gh api "$api/git/matching-refs/tags/v0.1.79" --jq '[.[] | select(.ref == "refs/tags/v0.1.79")] | length')" = 0
          if gh api "$api/releases/tags/v0.1.79" >/dev/null 2>"$RUNNER_TEMP/lan-li-existing.err"; then exit 1; fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/lan-li-existing.err"
          gh api --method POST "$api/git/refs" -f ref=refs/tags/v0.1.79 -f sha="$EXPECTED" --jq '[.ref,.object.sha] | @tsv'
          test "$(gh api "$api/git/ref/tags/v0.1.79" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag=v0.1.79 -f runner=macos-15-intel
