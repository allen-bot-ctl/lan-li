name: Verify LanLi model usage v0.1.82
on:
  push:
    branches: [integration/verify-v0.1.82]
    paths: [.github/workflows/dot-verify-llm-usage-v0.1.82.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755'
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      EXPECTED: 130c52b3d4f6829e147ced610657581f32798fa5
      EXPECTED_TREE: c760fc0fc814579f03383a8d6b46d511e98a9701
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED }}
          persist-credentials: false
      - name: Verify exact checked-out source and runner
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(uname -m)" = x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Native settings, fake-provider usage and restart
        run: npm run e2e -- e2e/llm-usage.spec.js e2e/settings-layout.spec.js e2e/prompt-0164.spec.js
      - name: Upload only synthetic usage captures and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-model-usage
          path: |
            test-results/**/usage-*.png
            test-results/**/trace.zip
          retention-days: 3
          if-no-files-found: warn
