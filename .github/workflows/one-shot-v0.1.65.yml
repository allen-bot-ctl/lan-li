name: Recover queued LanLi v0.1.65 Release

on:
  push:
    branches: [integration/release-v0.1.65]

permissions: {}

concurrency:
  group: one-shot-lan-li-v0.1.65
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755' && github.triggering_actor == 'allen-bot-ctl' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: 8ef5859c11ac64412ec5c6d79552cbd8c1cdf685
      ORIGINAL_RUN: 45354331431
      ORIGINAL_JOB: 138308296655
    steps:
      - name: Stop only the unassigned macos-latest run, then try native Intel
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          check_refs() {
            test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
            test "$(gh api "$api/git/ref/tags/v0.1.65" --jq .object.sha)" = "$EXPECTED"
            test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.64
            if gh api "$api/releases/tags/v0.1.65" >/dev/null 2>"$RUNNER_TEMP/existing.err"; then
              echo "Release already exists; refusing to replace it"
              exit 1
            fi
            grep -q 'HTTP 404' "$RUNNER_TEMP/existing.err"
          }
          check_refs
          test "$(gh api "$api/actions/runs/$ORIGINAL_RUN" --jq '[.head_sha,.head_branch,.event,.status,.path] | join(" ")')" = "$EXPECTED master workflow_dispatch queued .github/workflows/release.yml"
          test "$(gh api "$api/actions/jobs/$ORIGINAL_JOB" --jq '[.status,.run_id] | @tsv')" = "$(printf 'queued\t%s' "$ORIGINAL_RUN")"
          gh api --method POST "$api/actions/runs/$ORIGINAL_RUN/cancel"
          for attempt in {1..40}; do
            status="$(gh api "$api/actions/runs/$ORIGINAL_RUN" --jq '[.status,(.conclusion // "-")] | join(" ")')"
            if [[ "$status" == 'completed cancelled' ]]; then break; fi
            if [[ "$status" == completed* ]]; then echo "::error::Original run finished with $status"; exit 1; fi
            sleep 3
          done
          test "$status" = 'completed cancelled'
          check_refs
          active="$(gh api --method GET "$api/actions/workflows/release.yml/runs" -f head_sha="$EXPECTED" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          test "$active" = 0
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag=v0.1.65 -f runner=macos-15-intel
