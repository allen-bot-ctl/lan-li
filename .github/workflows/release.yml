name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS Intel (x64) packages
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS Intel dmg and zip
        run: npx electron-builder --mac dmg zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            dist/LanLi-*-mac-x64.dmg
            dist/LanLi-*-mac-x64.zip

  publish:
    name: Publish GitHub Release
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 栏历 ${{ github.ref_name }}
          body: |
            ## 栏历 ${{ github.ref_name }}

            本轮只提供 macOS Intel（x64）安装包。主下载是 `LanLi-*-mac-x64.dmg`，`LanLi-*-mac-x64.zip` 为备用压缩包。

            ### 安装

            - 下载 `LanLi-*-mac-x64.dmg`，打开后把「栏历」拖入「应用程序」。
            - 备用：下载 `LanLi-*-mac-x64.zip`，解压后得到「栏历.app」。
            - 当前只支持 Intel（x64）Mac，暂不提供 Apple Silicon（arm64）、Windows 或 Linux 安装包。

            ### 未签名说明

            macOS 构建未签名，不是 Developer ID 签名，也未公证。

            Gatekeeper 可能阻止首次打开。请在 Finder 中右键「栏历」选择「打开」，或到「系统设置 → 隐私与安全性」选择「仍要打开」。

            ### 源码

            https://github.com/allen-bot-ctl/lan-li
          files: |
            dist/LanLi-*-mac-x64.dmg
            dist/LanLi-*-mac-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
