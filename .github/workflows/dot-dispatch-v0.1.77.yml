name: Dispatch authorized LanLi v0.1.77
on:
  push:
    branches: [integration/release-v0.1.77]
permissions: {}
concurrency:
  group: one-shot-lan-li-v0.1.77
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'allen-bot-ctl/lan-li' && github.actor_id == '352863755' && github.triggering_actor == 'allen-bot-ctl' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: ec82ccbf4b246bbcd6fb38f7db01c6238495cd87
      BASELINE: 9d2dbd4a67b68064974c3db34951d7b4073dd7f1
    steps:
      - name: Verify exact revision, native success and vacant tag
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/tags/v0.1.76" --jq .object.sha)" = "$BASELINE"
          test "$(gh api "$api/releases/latest" --jq .tag_name)" = v0.1.76
          test "$(gh api "$api/actions/runs/45539686030" --jq '[.head_sha,.conclusion] | join(" ")')" = "0acd6dc274b9aaaed7b118ff1eaa9c892f6d0448 success"
          test "$(gh api "$api/git/commits/$EXPECTED" --jq '[.parents[].sha] | join(" ")')" = "e5161a5fa41f3fb88881b1844dc9aeff73e6d720"
          test "$(gh api "$api/git/commits/e5161a5fa41f3fb88881b1844dc9aeff73e6d720" --jq '[.parents[].sha] | join(" ")')" = "$BASELINE"
          test "$(gh api "$api/contents/package.json?ref=$EXPECTED" --jq .content | base64 -d | jq -r .version)" = 0.1.77
          test "$(gh api "$api/contents/release-notes/v0.1.77.md?ref=$EXPECTED" --jq .size)" -gt 0
          test "$(gh api "$api/git/matching-refs/tags/v0.1.77" --jq '[.[] | select(.ref == "refs/tags/v0.1.77")] | length')" = 0
          if gh api "$api/releases/tags/v0.1.77" >/dev/null 2>"$RUNNER_TEMP/lan-li-existing.err"; then
            echo "::error::Release already exists; refusing to replace it."
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/lan-li-existing.err"
          gh api --method POST "$api/git/refs" -f ref=refs/tags/v0.1.77 -f sha="$EXPECTED" --jq '[.ref,.object.sha] | @tsv'
          test "$(gh api "$api/git/ref/tags/v0.1.77" --jq .object.sha)" = "$EXPECTED"
          test "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" = "$EXPECTED"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag=v0.1.77 -f runner=macos-15-intel
